name: Veila Paint 0.7.0 APK

on:
  push:
    branches: [build/0.7.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version
          java -cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" com.android.tools.r8.D8 --version
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version
      - name: Download Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --version
      - name: Test, lint and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          /opt/gradle-8.11.1/bin/gradle --no-daemon --console=plain :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='studio.nuvora.veila'" /tmp/badging.txt
          grep -q "versionCode='11'" /tmp/badging.txt
          grep -q "versionName='0.7.0'" /tmp/badging.txt
          mkdir -p dist
          cp "$apk" dist/VeilaPaint-0.7.0-debug.apk
          sha256sum dist/VeilaPaint-0.7.0-debug.apk | tee dist/SHA256SUMS.txt
      - name: Publish verified APK to the private release branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/veila-release
          cp dist/VeilaPaint-0.7.0-debug.apk /tmp/veila-release/
          cp dist/SHA256SUMS.txt /tmp/veila-release/
          git switch --orphan apk/0.7.0
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p releases
          cp /tmp/veila-release/* releases/
          git add releases
          git -c user.name="Veila Paint CI" -c user.email="ci@nuvora.studio" commit -m "release: Veila Paint 0.7.0 APK"
          git push --force origin HEAD:refs/heads/apk/0.7.0
