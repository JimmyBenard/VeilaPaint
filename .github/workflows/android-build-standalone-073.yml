name: Veila Paint 0.7.3 APK

on:
  push:
    branches: [build/0.7.3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Download Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
      - name: Test, lint and assemble independent APK
        shell: bash
        run: |
          set -euo pipefail
          /opt/gradle-8.11.1/bin/gradle --no-daemon --console=plain :core:test :app:testDebugUnitTest :app:lintStandalone :app:assembleStandalone
          mkdir -p dist
          cp app/build/outputs/apk/standalone/app-standalone.apk dist/VeilaPaint-0.7.3.apk
      - name: Verify package, signature and matching source
        shell: bash
        run: |
          set -euo pipefail
          apk=dist/VeilaPaint-0.7.3.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q "package: name='studio.nuvora.veila.v073' versionCode='14' versionName='0.7.3'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$apk"
          git diff --exit-code HEAD
          git archive --format=zip --prefix=VeilaPaint-0.7.3/ --output=dist/VeilaPaint-0.7.3-source.zip "$GITHUB_SHA"
          sha256sum "$apk" dist/VeilaPaint-0.7.3-source.zip | tee dist/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VeilaPaint-0.7.3
          path: |
            dist/VeilaPaint-0.7.3.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload matching source archive
        uses: actions/upload-artifact@v4
        with:
          name: VeilaPaint-0.7.3-source
          path: |
            dist/VeilaPaint-0.7.3-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct GitHub download
        if: github.ref == 'refs/heads/build/0.7.3'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.7.3-independent"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Veila Paint 0.7.3 — APK autonome" --notes "APK autonome : palette circulaire au maintien d’un doigt et nouvelles vitesses simulées."
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/VeilaPaint-0.7.3.apk#VeilaPaint-0.7.3.apk dist/VeilaPaint-0.7.3-source.zip#VeilaPaint-0.7.3-source.zip --clobber
